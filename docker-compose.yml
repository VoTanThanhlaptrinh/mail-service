services:
  mail-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mail-service
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=/app/data/mail.db
    volumes:
      - ./data:/app/data
