services:
  db:
    image: postgres:16-alpine
    container_name: mail-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail_service
    ports:
      # Host port 5433 to avoid clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
