services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mail-service-smtp
    restart: unless-stopped
    ports:
      # SMTP port (matches SMTP_PORT=1025 in server/.env)
      - "${SMTP_PORT:-1025}:1025"
      # Web UI port to view and inspect all sent emails
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data:
